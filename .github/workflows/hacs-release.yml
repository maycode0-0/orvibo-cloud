{
  "name": "Publish HACS release",
  "on":
    {
      "schedule": [{ "cron": "17\u00203\u0020*\u0020*\u00202,5" }],
      "workflow_dispatch": {},
    },
  "permissions": { "contents": "read" },
  "concurrency": { "group": "hacs-release", "cancel-in-progress": false },
  "jobs":
    {
      "unit-tests":
        {
          "runs-on": "ubuntu-latest",
          "steps":
            [
              { "uses": "actions/checkout@v4" },
              {
                "uses": "actions/setup-python@v5",
                "with": { "python-version": "3.13" },
              },
              {
                "run": 'python -m pip install "aiohttp>=3.9.0" "pycryptodome>=3.20.0"',
              },
              { "run": "python -m unittest discover -s tests -v" },
            ],
        },
      "hacs":
        {
          "runs-on": "ubuntu-latest",
          "steps":
            [
              { "uses": "actions/checkout@v4" },
              {
                "uses": "hacs/action@main",
                "with": { "category": "integration" },
              },
            ],
        },
      "hassfest":
        {
          "runs-on": "ubuntu-latest",
          "steps":
            [
              { "uses": "actions/checkout@v4" },
              { "uses": "home-assistant/actions/hassfest@master" },
            ],
        },
      "release":
        {
          "if": "github.ref == 'refs/heads/main'",
          "needs": ["unit-tests", "hacs", "hassfest"],
          "runs-on": "ubuntu-latest",
          "permissions": { "contents": "write" },
          "steps":
            [
              { "uses": "actions/checkout@v4", "with": { "fetch-depth": 0 } },
              {
                "name": "Resolve release version",
                "id": "version",
                "uses": "actions/github-script@v7",
                "with":
                  {
                    "script": "const fs = require('fs');\nconst stable = JSON.parse(fs.readFileSync('custom_components/orvibo_cloud/manifest.json')).version;\nif (!/^0\\.\\d+\\.\\d+$/.test(stable)) { core.setFailed(`Invalid stable version: ${stable}`); return; }\nconst prerelease = context.eventName === 'schedule';\nif (prerelease) {\n const releases = await github.rest.repos.listReleases({...context.repo, per_page:100});\n const stableExists = releases.data.some(release => release.tag_name === `v${stable}`);\n const commitReleased = releases.data.some(release => release.target_commitish === context.sha && release.assets.some(asset => asset.name === 'orvibo_cloud.zip' && asset.state === 'uploaded' && asset.size >0));\n if (stableExists || commitReleased) { core.setOutput('publish', 'false'); return; }\n}\nconst version = prerelease ? `${stable}b${context.runNumber}` : stable;\ncore.setOutput('publish', 'true');\ncore.setOutput('version', version);\ncore.setOutput('tag', `v${version}`);\ncore.setOutput('prerelease', String(prerelease));",
                  },
              },
              {
                "name": "Build HACS ZIP",
                "if": "steps.version.outputs.publish == 'true'",
                "env":
                  {
                    "RELEASE_VERSION": "${{ steps.version.outputs.version }}",
                    "PRERELEASE": "${{ steps.version.outputs.prerelease }}",
                  },
                "shell": "bash",
                "run": "mkdir release-package\ncp -R custom_components/orvibo_cloud release-package/orvibo_cloud\nfind release-package/orvibo_cloud -type d -name __pycache__ -prune -exec rm -rf {} +\nfind release-package/orvibo_cloud -type f \\( -name '*.pyc' -o -name '*.pyo' \\) -delete\nif [[ \"$PRERELEASE\" == true ]]; then python -c 'import json,os,pathlib;p=pathlib.Path(\"release-package/orvibo_cloud/manifest.json\");d=json.loads(p.read_text());d[\"version\"]=os.environ[\"RELEASE_VERSION\"];p.write_text(json.dumps(d,indent=2)+\"\\n\")';fi\ncd release-package/orvibo_cloud\nzip -r ../../orvibo_cloud.zip .",
              },
              {
                "name": "Create or repair GitHub release",
                "if": "steps.version.outputs.publish == 'true'",
                "uses": "actions/github-script@v7",
                "env":
                  {
                    "RELEASE_TAG": "${{ steps.version.outputs.tag }}",
                    "PRERELEASE": "${{ steps.version.outputs.prerelease }}",
                  },
                "with":
                  {
                    "script": "const fs = require('fs');\nconst tag = process.env.RELEASE_TAG;\nlet release = await github.rest.repos.getReleaseByTag({...context.repo, tag}).catch(error => error.status ===404 ? null : Promise.reject(error));\nconst ref = await github.rest.git.getRef({...context.repo, ref:`tags/${tag}`}).catch(error => error.status ===404 ? null : Promise.reject(error));\nif (ref && ref.data.object.sha !== context.sha) { core.setFailed(`Tag ${tag} does not point to ${context.sha}`); return; }\nconst asset = release?.data.assets.find(item => item.name === 'orvibo_cloud.zip');\nif (asset?.state === 'uploaded' && asset.size >0) { core.notice(`Release ${tag} already exists`); return; }\nif (asset) await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id:asset.id});\nif (!release) release = await github.rest.repos.createRelease({...context.repo, tag_name:tag, target_commitish:context.sha, name:tag, generate_release_notes:true, prerelease:process.env.PRERELEASE === 'true'});\nconst data = fs.readFileSync('orvibo_cloud.zip');\nawait github.rest.repos.uploadReleaseAsset({...context.repo, release_id:release.data.id, name:'orvibo_cloud.zip', data, headers:{'content-type':'application/zip','content-length':data.length}});",
                  },
              },
            ],
        },
    },
}
