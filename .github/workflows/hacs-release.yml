name: Publish HACS release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/orvibo_cloud/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hacs-release
  cancel-in-progress: false

jobs:
  release:
    name: Create version tag and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate integration version
        id: version
        shell: bash
        run: |
          cd custom_components/orvibo_cloud
          version=$(
            python -c 'import json; print(json.load(open("manifest.json"))["version"])'
          )
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version in manifest.json: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag and release when missing
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.notice(`Release ${tag} already exists: ${release.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              generate_release_notes: true,
            });
            core.notice(`Created ${release.html_url}`);
